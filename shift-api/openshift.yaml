---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shift-api
  labels:
    app: shift-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shift-api
  template:
    metadata:
      labels:
        app: shift-api
    spec:
      containers:
        - name: shift-api
          image: shift-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: LLAMA_STACK_URL
              value: "http://localhost:8321"   # override with your remote URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: shift-api
spec:
  selector:
    app: shift-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: shift-api
spec:
  to:
    kind: Service
    name: shift-api
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect